<details class="card"><summary><h2>پشتیبان‌گیری</h2></summary><p class="m" style="margin:0 0 8px">اطلاعات فقط روی همین گوشی ذخیره می‌شود. گاهی فایل پشتیبان بگیر.</p><button id="ex">ذخیره فایل پشتیبان</button> <button id="im">بازیابی از فایل</button><input id="fi" type="file" accept=".json,application/json" hidden><p class="m" id="bm"></p></details>
</div>
<button id="fab" aria-label="افزودن دارایی">＋</button>
<div class="sheet" id="sh"><div class="pn"><h2 id="ft">افزودن دارایی</h2>
<div class="seg" id="cat"><button data-c="gold">طلا</button><button data-c="coin">سکه</button><button data-c="cur">ارز</button><button data-c="fund">صندوق طلا</button></div>
<div data-t="gold"><select id="gt"></select><input id="wt" inputmode="decimal" autocomplete="off" placeholder="وزن هر قطعه (گرم)"><input id="gc" inputmode="decimal" autocomplete="off" placeholder="تعداد (خالی = ۱)"><input id="kr" inputmode="decimal" autocomplete="off" placeholder="عیار (خالی = ۱۸)"></div>
<div data-t="coin" hidden><select id="kd"><option value="nim">نیم پهلوی</option><option value="rob">ربع پهلوی</option></select><input id="kc" inputmode="decimal" autocomplete="off" placeholder="تعداد"></div>
<div data-t="cur" hidden><select id="cc"><option value="usd">دلار</option><option value="gbp">پوند</option></select><input id="am" inputmode="decimal" autocomplete="off" placeholder="مقدار"></div>
<div data-t="fund" hidden><input id="fc" inputmode="decimal" autocomplete="off" placeholder="تعداد واحد صندوق"></div>
<input id="nm" autocomplete="off" placeholder="یادداشت (اختیاری)">
<p class="er" id="er"></p><button id="sv">ذخیره</button> <button id="cl">انصراف</button></div></div>
<script>
const $=i=>document.getElementById(i),DG='۰۱۲۳۴۵۶۷۸۹',AR='٠١٢٣٤٥٦٧٨٩';
const n=s=>parseFloat(String(s).replace(/[۰-۹]/g,d=>DG.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[٬,،\s]/g,'').replace('٫','.'))||0;
const f=(x,d=0)=>x.toLocaleString('fa-IR',{maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KS=[['usd','دلار','تومان',0],['gbp','پوند','تومان',0],['oz','اونس جهانی','دلار',0],['g18','هر گرم طلای ۱۸','تومان',1],['nim','نیم پهلوی','تومان',1],['rob','ربع پهلوی','تومان',1],['fund','صندوق طلای عیار (کارگزاری مفید)','تومان',0]];
const KN={nim:'نیم پهلوی',rob:'ربع پهلوی'},W0={nim:4.0665,rob:2.03225};
const GT=['دستبند','النگو','گردنبند','گوشواره','انگشتر','سرویس','زنجیر','شکسته/آب‌شده','سایر'];
const U='https://servatmandi.com/Entity/Summary/',CL={gold:'#e6b93a',coin:'#e8832a',cur:'#2fa878',fund:'#9b7ede'},LB={gold:'طلا',coin:'سکه',cur:'ارز',fund:'صندوق'};
const TG='https://call2.tgju.org/ajax.json',TM={usd:'price_dollar_rl',gbp:'price_gbp',oz:'ons',g18:'geram18',fund:'ime_fund_ayar'};
const S0=()=>({assets:[],mode:{},man:{},bub:{},w:{},on:{},src:{usd:U+'100000000001',gbp:U+'100000000008',oz:U+'10000000001901',g18:U+'5000000001102',fund:'https://servatmandi.com/TsetmcInstrument/Summary/34144395039913458'},ut:0,bk:0});
let S=S0(),ed=null,rm=null,cat='gold';
const W=k=>S.w[k]>0?S.w[k]:W0[k],cnt=a=>a.ct>0?a.ct:1,gk=a=>a.t;
function P(k){const m=S.mode[k]||((k=='nim'||k=='rob')?'formula':'online');
 if(m=='manual')return S.man[k]>0?S.man[k]:null;
 if(m=='online')return S.on[k]>0?S.on[k]:S.man[k]>0?S.man[k]:null;
 const u=P('usd'),z=P('oz');if(!u||!z)return null;const g=u*z/31.1035;
 return k=='g18'?g*.75:g*.9*W(k)}
function val(a){const p=a.t=='gold'?P('g18'):a.t=='coin'?P(a.kd):a.t=='fund'?P('fund'):P(a.cc);if(!p)return null;
 return a.t=='gold'?cnt(a)*a.wt*a.kr/18*p:(a.t=='coin'||a.t=='fund')?cnt(a)*p:a.am*p}
function save(){try{localStorage.setItem('assets_v1',JSON.stringify(S))}catch(e){$('wn').hidden=false}}
function render(){let tot=0,sub={gold:0,coin:0,cur:0,fund:0},miss=new Set,gw=0,ge=0,gc=0,by={},fu=0,fv=0;
 const rows=S.assets.map(a=>{const v=val(a);if(v==null)miss.add(a.t=='gold'?'g18':a.t=='coin'?a.kd:a.t=='fund'?'fund':a.cc);else{tot+=v;sub[gk(a)]+=v}
  if(a.t=='fund'){fu+=cnt(a);fv+=v||0}if(a.t=='gold'){const c=cnt(a),w=c*a.wt,g=a.gt||'سایر',b=by[g]=by[g]||{c:0,w:0,v:0};gw+=w;ge+=w*a.kr/18;gc+=c;b.c+=c;b.w+=w;b.v+=v||0}return[a,v]});
 let o=0;const R=40,L=2*Math.PI*R,ring=Object.keys(CL).map(k=>{const p=tot?sub[k]/tot:0,s=`<circle r="${R}" cx="50" cy="50" fill="none" stroke="${CL[k]}" stroke-width="13" stroke-dasharray="${p*L} ${L}" stroke-dashoffset="${-o*L}" transform="rotate(-90 50 50)"/>`;o+=p;return s}).join('');
 const lg=Object.keys(CL).map(k=>`<span><i style="background:${CL[k]}"></i>${LB[k]} ${f(tot?sub[k]/tot*100:0)}٪</span>`).join('');
 $('sum').innerHTML=`<div><div class="m">ارزش کل (تومان)</div><div class="big">${f(tot)}</div><div class="lg">${lg}</div></div><svg viewBox="0 0 100 100"><circle r="${R}" cx="50" cy="50" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="13"/>${ring}</svg>`+
 (miss.size?`<div class="er">قیمت ثبت‌نشده؛ در جمع نیامده: ${[...miss].map(k=>KS.find(x=>x[0]==k)[1]).join('، ')}</div>`:'')+
 `<small>${S.on.t?'آخرین دریافت آنلاین: '+new Date(S.on.t).toLocaleString('fa-IR'):'قیمت آنلاین هنوز دریافت نشده'}</small>`;
 $('strip').innerHTML=['usd','g18','nim','rob'].map(k=>{const p=P(k),l=KS.find(x=>x[0]==k)[1];return `<div style="min-width:0;text-align:center"><small>${l}</small><div style="font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p?f(p,k=='oz'?2:0):'—'}</div></div>`}).join('');
 $('gs').innerHTML=(gc||fu)?`<div class="card"><div class="m">طلای شما</div>${gc?`<div class="big2">${f(gw,2)} گرم</div><small>معادل ${f(ge,2)} گرم ۱۸ عیار · ${f(gc)} قطعه</small>`:''}${fu?`<div><small>صندوق طلا: ${f(fu,2)} واحد · ${f(fv)} تومان</small></div>`:''}${gc?`<details><summary><small>به تفکیک نوع</small></summary>${Object.keys(by).map(g=>`<div class="r h"><span>${esc(g)} <small>(${f(by[g].c)} عدد)</small></span><span>${f(by[g].w,2)} گرم · ${f(by[g].v)}</span></div>`).join('')}</details>`:''}</div>`:'';
 const row=([a,v])=>`<div class="r"><div class="h"><b>${a.t=='gold'?esc(a.gt||'طلا'):a.t=='coin'?'سکه '+(KN[a.kd]||''):a.t=='fund'?'صندوق طلا':a.cc=='usd'?'دلار':'پوند'}${a.nm?' <small>· '+esc(a.nm)+'</small>':''}</b><span>${v==null?'—':f(v)}</span></div><div class="h"><small>${a.t=='gold'?f(cnt(a))+' عدد × '+f(a.wt,3)+' گرم · عیار '+f(a.kr,1):a.t=='coin'?f(cnt(a),2)+' عدد':a.t=='fund'?f(cnt(a),2)+' واحد':f(a.am,2)}</small><span><button class="ib" data-e="${a.id}">ویرایش</button> <button class="ib" data-d="${a.id}">${rm==a.id?'مطمئنی؟':'حذف'}</button></span></div></div>`;
 const gp=(t,l)=>{const x=rows.filter(r=>gk(r[0])==t);return x.length?`<details class="card" open><summary><h2>${l}</h2><b>${f(sub[t])}</b></summary>${x.map(row).join('')}</details>`:''};
 $('gp').innerHTML=gp('gold','طلا')+gp('coin','سکه')+gp('cur','ارز')+gp('fund','صندوق طلا')||'<p class="m">هنوز دارایی‌ای ثبت نشده. با دکمه ＋ اضافه کن.</p>';
 const used=new Set(S.assets.filter(a=>a.t=='coin'||a.t=='fund').map(a=>a.t=='fund'?'fund':a.kd)),shown=x=>['usd','gbp','oz','g18'].includes(x[0])||used.has(x[0]);
 $('pr').innerHTML=KS.filter(shown).map(([k,l,u,d])=>{const m=S.mode[k]||(d?'formula':'online'),p=P(k),dc=k=='oz'?2:0,op=[['online','آنلاین'],['manual','دستی']];if(d)op.unshift(['formula','فرمول']);
 return`<div class="r"><div class="h"><b>${l}</b><span>${p?f(p,dc):'—'} <small>${u}</small></span></div><div class="c"><select data-k="${k}" data-f="m">${op.map(([v,t])=>`<option value="${v}"${v==m?' selected':''}>${t}</option>`).join('')}</select>
 ${m=='manual'?`<input data-k="${k}" data-f="man" inputmode="decimal" autocomplete="off" value="${S.man[k]||''}" placeholder="قیمت دستی">`:''}
 ${m=='formula'&&k!='g18'?`<label><small>وزن</small> <input data-k="${k}" data-f="w" inputmode="decimal" value="${W(k)}" style="width:80px"></label>`:''}
 ${m=='online'?`<small>${S.on[k]>0?'دریافت‌شده: '+f(S.on[k],dc):'دریافت نشده'}</small><input data-k="${k}" data-f="man" inputmode="decimal" autocomplete="off" value="${S.man[k]||''}" placeholder="دستی (اگر آنلاین نشد)">`:''}</div></div>`}).join('');
 $('sr').innerHTML=KS.filter(shown).map(([k,l])=>`<label><small>${l}</small><input data-s="${k}" dir="ltr" style="width:100%;margin:2px 0 6px" value="${esc(S.src[k]||'')}" placeholder="https://servatmandi.com/Entity/Summary/..."></label>`).join('');
 $('bm').textContent=S.bk?'آخرین پشتیبان: '+new Date(S.bk).toLocaleString('fa-IR'):'هنوز پشتیبان نگرفته‌ای'}
async function grab(url){let why='net';
 for(const p of ['','https://r.jina.ai/','https://api.allorigins.win/raw?url=']){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),p?20000:8000);
  const r=await fetch(!p?url:p.includes('jina')?p+url:p+encodeURIComponent(url),{signal:c.signal});clearTimeout(t);if(!r.ok){if(why!='nf')why='http'+r.status;continue}
  const m=(await r.text()).replace(/<[^>]*>/g,' ').match(/آخرین\s*(?:قیمت|ارزش|مقدار)[\s|:：*]*([0-9۰-۹٠-٩][0-9۰-۹٠-٩,٬.٫]*)/),v=m&&n(m[1]);if(v>0)return{v};why='nf'}catch(e){}}
 return{why}}
async function grabJson(){let why='net';
 for(const u of [TG,'https://call1.tgju.org/ajax.json','https://api.allorigins.win/raw?url='+encodeURIComponent(TG)]){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
  const r=await fetch(u,{signal:c.signal});clearTimeout(t);if(!r.ok){why='http'+r.status;continue}
  const j=await r.json(),cur=j&&j.current;if(!cur||typeof cur!='object'){why='nf';continue}
  const out={},stale=[];let got=0;for(const k in TM){const it=cur[TM[k]],v=it&&n(it.p);if(!(v>0))continue;
   if(k=='fund'){const ts=it.ts?Date.parse(String(it.ts).replace(' ','T')):0;if(ts&&Date.now()-ts>48*3600e3){stale.push(k);continue}}
   out[k]=k=='oz'?v:v/10;got++}
  if(got)return{out,stale};why='nf'}catch(e){}}
 return{why}}
$('fx').onclick=async()=>{$('fx').disabled=true;$('os').textContent='در حال دریافت…';const ok=[],bad=[];
 const j=await grabJson();
 if(j.out){for(const k in j.out){S.on[k]=j.out[k];ok.push(k)}}else for(const k in TM)bad.push([k,j.why]);
 if(j.stale&&j.stale.length)for(const k of j.stale)bad.push([k,'stale']);
 if(!S.on.fund||j.stale&&j.stale.includes('fund')){if(S.src.fund){const r=await grab(S.src.fund);if(r.v){S.on.fund=r.v/10;ok.push('fund');const bi=bad.findIndex(b=>b[0]=='fund');if(bi>=0)bad.splice(bi,1)}else if(!bad.some(b=>b[0]=='fund'))bad.push(['fund',r.why])}}
 if(ok.length){S.on.t=Date.now();save()}$('fx').disabled=false;
 const why=w=>({net:'اتصال برقرار نشد',nf:'قیمت در صفحه پیدا نشد',stale:'قیمت صندوق قدیمی است؛ دستی وارد کن'}[w]||'خطای سایت '+w),bt=bad.map(([k,w])=>KS.find(x=>x[0]==k)[1]+' ('+why(w)+')').join('، ');
 $('os').textContent=ok.length?ok.map(k=>KS.find(x=>x[0]==k)[1]+': '+f(S.on[k],k=='oz'?2:0)).join(' · ')+(bt?' · ناموفق: '+bt:''):'دریافت ناموفق: '+bt;render()};
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k;
 if(t.dataset.s){S.src[t.dataset.s]=t.value.trim();save();return}
 if(!k)return;if(t.dataset.f=='m')S.mode[k]=t.value;else S[t.dataset.f][k]=n(t.value);save();render()});
document.addEventListener('click',e=>{const t=e.target,d=t.dataset||{};
 if(d.d){if(rm==d.d){S.assets=S.assets.filter(a=>a.id!=rm);rm=null;save()}else rm=d.d;render()}
 if(d.e){const a=S.assets.find(x=>x.id==d.e);if(a)openSh(a)}
 if(d.c)setCat(d.c);if(t.id=='sh')closeSh()});
function tab(i){$('pa').hidden=i!=1;$('pb').hidden=i!=2;$('t1').classList.toggle('on',i==1);$('t2').classList.toggle('on',i==2)}
function setCat(c){cat=c;document.querySelectorAll('[data-t]').forEach(d=>d.hidden=d.dataset.t!=c);document.querySelectorAll('#cat button').forEach(b=>b.classList.toggle('on',b.dataset.c==c))}
function clr(){document.querySelectorAll('.pn input').forEach(i=>i.value='');$('er').textContent=''}
function openSh(a){ed=a?a.id:null;clr();$('cat').hidden=!!a;setCat(a?a.t:'gold');
 if(a){$('nm').value=a.nm||'';if(a.t=='gold'){$('gt').value=a.gt||'سایر';$('wt').value=a.wt;$('gc').value=cnt(a)>1?cnt(a):'';$('kr').value=a.kr}
  if(a.t=='coin'){$('kd').value=a.kd;$('kc').value=cnt(a)}if(a.t=='cur'){$('cc').value=a.cc;$('am').value=a.am}if(a.t=='fund')$('fc').value=cnt(a);}
 $('ft').textContent=a?'ویرایش دارایی':'افزودن دارایی';$('sh').classList.add('on')}
function closeSh(){$('sh').classList.remove('on');ed=null}
$('fab').onclick=()=>openSh();$('cl').onclick=closeSh;$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
$('sv').onclick=()=>{const a={id:ed||Date.now().toString(36),t:cat,nm:$('nm').value.trim()},er=s=>{$('er').textContent=s};
 if(cat=='gold'){a.gt=$('gt').value;a.wt=n($('wt').value);a.ct=$('gc').value.trim()?n($('gc').value):1;a.kr=$('kr').value.trim()?n($('kr').value):18;if(!(a.wt>0&&a.ct>0&&a.kr>0&&a.kr<=24))return er('وزن، تعداد و عیار (حداکثر ۲۴) را درست وارد کن')}
 if(cat=='coin'){a.kd=$('kd').value;a.ct=n($('kc').value);if(!(a.ct>0))return er('تعداد را وارد کن')}
 if(cat=='cur'){a.cc=$('cc').value;a.am=n($('am').value);if(!(a.am>0))return er('مقدار را وارد کن')}
 if(cat=='fund'){a.ct=n($('fc').value);if(!(a.ct>0))return er('تعداد واحد را وارد کن')}
 const i=S.assets.findIndex(x=>x.id==a.id);i<0?S.assets.push(a):S.assets[i]=a;save();closeSh();render()};
$('ex').onclick=()=>{S.bk=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='assets-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();render()};
$('im').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{let ok=1;try{const d=JSON.parse(r.result);if(!Array.isArray(d.assets))throw 0;S=Object.assign(S0(),d);S.src=Object.assign(S0().src,S.src);save();render()}catch(x){ok=0}$('bm').textContent=ok?'بازیابی شد ✓':'فایل معتبر نیست'};r.readAsText(fl);e.target.value=''};
$('gt').innerHTML=GT.map(g=>`<option>${g}</option>`).join('');
try{S=Object.assign(S0(),JSON.parse(localStorage.getItem('assets_v1')))}catch(e){}
S.src=Object.assign(S0().src,S.src);if(S.src.tam==U+'5000000001202')delete S.src.tam;
try{navigator.storage.persist().catch(()=>{})}catch(e){}
setCat('gold');render();
if(!S.on.t||Date.now()-S.on.t>18e5)setTimeout(()=>$('fx').onclick(),300);
if(location.protocol.indexOf('http')==0&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script></body></html>
